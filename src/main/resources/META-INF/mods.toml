modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Client side only: never affects the server list or joining a server.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="blessfulled"
    mandatory=true
    versionRange="${blessfulled_version_range}"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="oculus"
    mandatory=true
    versionRange="[1.6,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
    config = "${mod_id}.mixins.json"
